spring.application.name=QuizWiz

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://quizwiz-tg091-production-504c.up.railway.app/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${OAUTH_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=https://quizwiz-tg091-production-504c.up.railway.app/login/oauth2/code/github

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Supabase REST API Settings
supabase.url=${SUPABASE_URL}
supabase.anon_key=${SUPABASE_ANON_KEY}
supabase.service_role_key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.table.users=Users

# Production Configuration
server.port=${PORT:8080}
app.frontend.url=https://quiz-wiz-tg-09-1.vercel.app/
spring.profiles.active=dev

SUPABASE_URL=https://ekpiljilvqbqoyenrxrz.supabase.co/rest/v1
SUPABASE_ANON_KEY=
SUPABASE_SERVICE_ROLE_KEY=


# Additional security for production
server.forward-headers-strategy=framework
